        <header>

        </header>
        <main>
            <h1>Enquiries</h1>
            <p>Have a question about our services? Fill in the form below and we will get back to you as soon as possible.</p>

            <form action="mailto:busiwane@gmail.com" method="post" enctype="text/plain" class="enquiry-form">

                <label for="name">Full Name</label>
                <input type="text" id="name" name="Full Name" placeholder="Enter your full name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="Email" placeholder="Enter your email address" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="Phone" placeholder="Enter your phone number">

                <label for="service">Service you are enquiring about</label>
                <select id="service" name="Service">
                    <option value="Consultations">Consultations</option>
                    <option value="Circumcisions">Circumcisions</option>
                    <option value="Baby Wellness">Baby Wellness</option>
                    <option value="Family planning">Family planning</option>
                    <option value="HIV testing and counselling">HIV testing and counselling</option>
                    <option value="Wound care">Wound care</option>
                    <option value="Blood pressure, cholesterol and glucose screening">Blood pressure, cholesterol and glucose screening</option>
                    <option value="Postnatal care">Postnatal care</option>
                    <option value="Wellness assessments">Wellness assessments</option>
                    <option value="Other">Other</option>
                </select>

                <label for="message">Your Message</label>
                <textarea id="message" name="Message" rows="6" placeholder="Type your enquiry here..." required></textarea>

                <button type="submit">Send Enquiry</button>

            </form>
        </main>
        <footer>&copy; ST10531223</footer>
    </body>
